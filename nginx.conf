worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # Needed for Grafana Live (websockets) to pass through the proxy.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Backend app — default host. Serves the apex domain, the raw EC2 IP, and
    # any hostname not matched by a more specific server block below.
    # Behaviour unchanged from before.
    server {
        listen       80 default_server;
        server_name  _;

        location / {
            proxy_pass http://app:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # Grafana — routed by subdomain. Cloudflare forwards the Host header, so
    # requests to this subdomain hit Grafana instead of the app. No extra host
    # port needed: nginx reaches Grafana over the internal `observability`
    # network by container name.
    server {
        listen       80;
        server_name  grafana.cybertechmind.com;

        location / {
            proxy_pass http://grafana:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # Cloudflare terminates TLS at the edge; tell Grafana the public
            # scheme is https so its redirects, cookies and links are correct.
            proxy_set_header X-Forwarded-Proto https;

            # Grafana Live (dashboards, streaming) uses websockets.
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }
}
