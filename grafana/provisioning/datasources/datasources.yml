# Datasources are provisioned automatically — nobody should have to click
# through the Grafana UI after `docker compose up -d`.
#
# URLs are Docker DNS names on the `observability` network. A localhost URL
# would resolve to the Grafana container itself and fail.
#
# The fixed `uid` values matter: the provisioned dashboard references
# datasources by uid, so they must stay stable.

apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
    jsonData:
      # Match the Prometheus scrape_interval so rate() windows line up.
      timeInterval: 15s
      httpMethod: POST

  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://loki:3100
    editable: true
    jsonData:
      maxLines: 1000
      # Lets Grafana jump from a log line to the matching metrics window.
      derivedFields: []
